<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stardust Core OS | Galaxy Edition</title>
    
    <!-- เชื่อมต่อ Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
    
    <!-- เชื่อมต่อ SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <!-- เชื่อมต่อ CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- หน้าจอเปิดตัวโลโก้ (Splash Screen) -->
    <div id="splash-screen">
        <!-- เปลี่ยน LogoHG.png เป็นชื่อไฟล์รูปโลโก้ของคุณ -->
        <img src="LogoSC.png" alt="StardustCoreLogo" id="splash-logo">
        <div class="loading-text">INITIALIZING SYSTEM...</div>
    </div>

    <!-- หน้าจอโชว์ IG -->
    <div id="ig-screen">
        <div class="ig-content">
            <!-- เปลี่ยน Instagram_icon.png เป็นชื่อไฟล์รูปไอคอน IG ของคุณ -->
            <img src="Instagram_icon.png" class="ig-icon-img" alt="Instagram">
            <span class="ig-handle">sileiabeans</span>
        </div>
    </div>

    <!-- เอฟเฟกต์ดาวระยิบระยับพื้นหลัง -->
    <div class="starfield"></div>

    <main class="container" id="main-content" style="display: none; opacity: 0; transform: translateY(20px); transition: all 1s ease-in-out;">        <!-- ส่วนหัว (Hero) -->
        <header class="hero">
            <div class="status-badge">System Online</div>
            <h1>Stardust Core</h1>
            <p class="subtitle">บันทึกพิกัดและประเมินสถานะการสำรวจเนบิวลา</p>
        </header>

        <form id="assessmentForm">
            <!-- ส่วนที่ 1: ข้อมูลนักบิน -->
            <section class="form-section">
                <div class="section-label">01 / PERSONNEL IDENTITY</div>
                
                <div class="input-group">
                    <label for="pilot-name">นามเรียกขาน (Name)</label>
                    <input type="text" id="pilot-name" name="name" placeholder="ENTER PILOT NAME..." required>
                </div>

                <div class="input-group">
                    <label>ระดับชั้นอายุ (Age)</label>
                    <div class="custom-select">
                        <input type="radio" id="rank1" name="rank" value="ต่ำกว่า 19 ปี" required>
                        <label for="rank1" class="select-box">ต่ำกว่า 19 ปี</label>
                        
                        <input type="radio" id="rank2" name="rank" value="19-23 ปี">
                        <label for="rank2" class="select-box">19-23 ปี</label>
                        
                        <input type="radio" id="rank3" name="rank" value="23">
                        <label for="rank3" class="select-box">23 ปีขึ้นไป</label>
                    </div>
                </div>
            </section>

            <!-- ส่วนที่ 2: การประเมินภารกิจ -->
            <section class="form-section">
                <div class="section-label">02 / MISSION FEEDBACK</div>

                <!-- ข้อที่ 1: การออกแบบของตัวละคร -->
                <div class="input-group">
                    <label>การออกแบบของตัวละคร (Character Design)</label>
                    <div class="star-rating">
                        <input type="radio" id="design5" name="character_design" value="5" required>
                        <label for="design5" class="rating-label">5</label>
                        
                        <input type="radio" id="design4" name="character_design" value="4">
                        <label for="design4" class="rating-label">4</label>
                        
                        <input type="radio" id="design3" name="character_design" value="3">
                        <label for="design3" class="rating-label">3</label>
                        
                        <input type="radio" id="design2" name="character_design" value="2">
                        <label for="design2" class="rating-label">2</label>
                        
                        <input type="radio" id="design1" name="character_design" value="1">
                        <label for="design1" class="rating-label">1</label>
                    </div>
                </div>

                <!-- ข้อที่ 2: Concept ของตัวละคร -->
                <div class="input-group">
                    <label>Concept ของตัวละคร (Character Concept)</label>
                    <div class="star-rating">
                        <input type="radio" id="concept5" name="character_concept" value="5" required>
                        <label for="concept5" class="rating-label">5</label>
                        
                        <input type="radio" id="concept4" name="character_concept" value="4">
                        <label for="concept4" class="rating-label">4</label>
                        
                        <input type="radio" id="concept3" name="character_concept" value="3">
                        <label for="concept3" class="rating-label">3</label>
                        
                        <input type="radio" id="concept2" name="character_concept" value="2">
                        <label for="concept2" class="rating-label">2</label>
                        
                        <input type="radio" id="concept1" name="character_concept" value="1">
                        <label for="concept1" class="rating-label">1</label>
                    </div>
                </div>

                <!-- ข้อที่ 3: การจัดวางบูธ -->
                <div class="input-group">
                    <label>การจัดวางบูธ (Booth Layout)</label>
                    <div class="star-rating">
                        <input type="radio" id="booth5" name="booth_layout" value="5" required>
                        <label for="booth5" class="rating-label">5</label>
                        
                        <input type="radio" id="booth4" name="booth_layout" value="4">
                        <label for="booth4" class="rating-label">4</label>
                        
                        <input type="radio" id="booth3" name="booth_layout" value="3">
                        <label for="booth3" class="rating-label">3</label>
                        
                        <input type="radio" id="booth2" name="booth_layout" value="2">
                        <label for="booth2" class="rating-label">2</label>
                        
                        <input type="radio" id="booth1" name="booth_layout" value="1">
                        <label for="booth1" class="rating-label">1</label>
                    </div>
                </div>

                <!-- ข้อความเสนอแนะ -->
                <div class="input-group">
                    <label for="message">ข้อความถึงศูนย์ควบคุม (ข้อเสนอแนะ)</label>
                    <textarea id="message" name="feedback" rows="4" placeholder="TEXT YOUR MESSAGE HERE..."></textarea>
                </div>
            </section>


            <!-- ส่วนที่ 3: เลือกตัวละคร (Entity Encounter) -->
            <section class="form-section">
                <div class="section-label"><span class="num">03</span> / ENTITY ENCOUNTER</div>

                <div class="input-group">
                    <label>ระบุสิ่งมีชีวิต/ตัวละครที่คุณประทับใจในภารกิจนี้ (เลือกได้หลายตัวละคร)</label>
                    
                    <div class="character-grid">
                        <!-- ตัวละครที่ 1 -->
                        <label class="character-card">
                            <input type="checkbox" name="fav_character" value="Character 1">
                            <img src="Asteroisuar.png" alt="Char 1">
                            <span class="char-name">ASTEROISUAR</span>
                        </label>

                        <!-- ตัวละครที่ 2 -->
                        <label class="character-card">
                            <input type="checkbox" name="fav_character" value="Character 2">
                            <img src="Korsdaver.png" alt="Char 2">
                            <span class="char-name">KORS DAVER</span>
                        </label>

                        <!-- ตัวละครที่ 3 -->
                        <label class="character-card">
                            <input type="checkbox" name="fav_character" value="Character 3">
                            <img src="Yang.png" alt="Char 3">
                            <span class="char-name">YANGWEIMING</span>
                        </label>

                        <!-- ตัวละครที่ 4 -->
                        <label class="character-card">
                            <input type="checkbox" name="fav_character" value="Character 4">
                            <img src="Jaxx.png" alt="Char 4">
                            <span class="char-name">JAXX</span>
                        </label>

                        <!-- ตัวละครที่ 5 -->
                        <label class="character-card">
                            <input type="checkbox" name="fav_character" value="Character 5">
                            <img src="Chariot.png" alt="Char 5">
                            <span class="char-name">CHARIOT</span>
                        </label>

                        <!-- ตัวละครที่ 6 -->
                        <label class="character-card">
                            <input type="checkbox" name="fav_character" value="Character 6">
                            <img src="Ego.png" alt="Char 6">
                            <span class="char-name">E.G.O</span>
                        </label>
                    </div>
                </div>
            </section>

            <!-- ปุ่มส่งข้อมูล -->
            <button type="submit" id="submitBtn">INITIATE LAUNCH</button>
        </form>

        <!-- ส่วนท้าย -->
        <footer class="main-footer">
            <p>©2026 ART TOYS PROJECT</p>
            <div class="social-links">
                <p>Presented by</p>
                <a href="https://www.instagram.com/sileiabeans/" target="_blank">
                    <img src="Instagram_icon.png" alt="IG" class="footer-icon">
                    sileiabeans
                </a>
                <a href="#">GITHUB</a>
            </div>
        </footer>
    </main>

    <!-- เชื่อมต่อ JavaScript -->
    <script src="script.js"></script>
</body>
</html>
