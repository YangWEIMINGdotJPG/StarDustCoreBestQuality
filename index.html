<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stellar Explorer - Space Assessment</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <!-- หน้าจอเปิดตัวยานอวกาศ -->
    <div id="splash-screen">
        <div class="loader"></div>
        <h2 style="color: #00d4ff; margin-top: 20px;">INITIALIZING SYSTEM...</h2>
    </div>

    <div class="container">
        <!-- เปลี่ยน Banner เป็นรูปอวกาศ -->
        <div class="header-space">
            <h1 class="mission-title">บันทึกภารกิจสำรวจ</h1>
            <p class="mission-subtext">กรุณาส่งรายงานการสำรวจของคุณกลับไปยังศูนย์ควบคุม</p>
        </div>

        <form id="assessmentForm">
            <div class="section">
                <h2><i class="icon">🚀</i> ข้อมูลนักบิน</h2>
                <div class="question-box">
                    <label class="main-q">ชื่อรหัสนักบิน (Callsign)</label>
                    <input type="text" name="name" placeholder="ระบุชื่อของคุณ..." required>
                </div>
                <div class="question-box">
                    <label class="main-q">ระยะเวลาการปฏิบัติหน้าที่</label>
                    <input type="radio" id="age1" name="age" value="น้อยกว่า 1 ปี" required>
                    <label for="age1" class="age-label">น้อยกว่า 1 ปี</label>
                    
                    <input type="radio" id="age2" name="age" value="1-3 ปี">
                    <label for="age2" class="age-label">1-3 ปี</label>
                    
                    <input type="radio" id="age3" name="age" value="มากกว่า 3 ปี">
                    <label for="age3" class="age-label">มากกว่า 3 ปี</label>
                </div>
            </div>

            <!-- ส่วนการประเมิน UI/UX ในธีมอวกาศ -->
            <div class="section">
                <h2><i class="icon">🛰️</i> ระบบควบคุมและดีไซน์ (UI)</h2>
                <div class="question-box">
                    <label class="main-q">ความสวยงามของอินเทอร์เฟซยานอวกาศ</label>
                    <div class="rating-container">
                        <input type="radio" id="ui1_5" name="ui_1" value="5" required><label for="ui1_5" class="rating-label">5</label>
                        <input type="radio" id="ui1_4" name="ui_1" value="4"><label for="ui1_4" class="rating-label">4</label>
                        <input type="radio" id="ui1_3" name="ui_1" value="3"><label for="ui1_3" class="rating-label">3</label>
                        <input type="radio" id="ui1_2" name="ui_1" value="2"><label for="ui1_2" class="rating-label">2</label>
                        <input type="radio" id="ui1_1" name="ui_1" value="1"><label for="ui1_1" class="rating-label">1</label>
                    </div>
                </div>
            </div>

            <div class="section">
                <h2><i class="icon">💬</i> ข้อเสนอแนะจากวงโคจร</h2>
                <div class="question-box">
                    <textarea name="feedback" rows="4" placeholder="พิมพ์ข้อความของคุณส่งถึงศูนย์ควบคุม..."></textarea>
                </div>
            </div>

            <div style="padding: 25px;"><button type="submit" id="submitBtn">LAUNCH DATA</button></div>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
